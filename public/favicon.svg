<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      .bg {
        fill: #181818;
        stroke: #2e2e2e;
        stroke-width: 2px;
      }
      .hz-text {
        fill: #ffffff;
        font-family: "SF Mono", "SFMono-Regular", ui-monospace, Menlo, Monaco, Consolas, monospace;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      @media (prefers-color-scheme: light) {
        .bg {
          fill: #f8f8f8;
          stroke: #e0e0e0;
        }
        .hz-text {
          fill: #1f1f1f;
        }
      }
    </style>
  </defs>
  <rect class="bg" x="2" y="2" width="60" height="60" rx="15" />
  <text class="hz-text" x="32" y="33" dominant-baseline="central" text-anchor="middle">HZ</text>
</svg>
